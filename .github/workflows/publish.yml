name: Publish to npm

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: npm-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
          cache: npm
      - run: npm install -g "npm@^11.5.1"
      - run: npm run audit:dependencies
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - run: npm pack --dry-run

  publish:
    needs: validate
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
          registry-url: 'https://registry.npmjs.org'
      - run: npm install -g "npm@^11.5.1"
      - run: npm ci
      - run: npm --version
      - name: Read package metadata
        id: pkg
        run: |
          name=$(node -e "console.log(require('./package.json').name)")
          version=$(node -e "console.log(require('./package.json').version)")
          server=$(node -e "console.log(encodeURIComponent(require('./server.json').name))")
          echo "name=${name}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "server=${server}" >> "$GITHUB_OUTPUT"
      - name: Check whether version is already published
        id: npm
        run: |
          if npm view "${{ steps.pkg.outputs.name }}@${{ steps.pkg.outputs.version }}" version --json >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "${{ steps.pkg.outputs.name }}@${{ steps.pkg.outputs.version }} is already published. Skipping npm publish."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "${{ steps.pkg.outputs.name }}@${{ steps.pkg.outputs.version }} is not published yet."
          fi
      - name: Publish to npm
        if: steps.npm.outputs.exists == 'false'
        run: npm publish --access public --provenance
      - name: Tag release commit
        if: steps.npm.outputs.exists == 'false'
        env:
          VERSION: ${{ steps.pkg.outputs.version }}
        run: |
          tag="v${VERSION}"
          if git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null 2>&1; then
            echo "Tag ${tag} already exists."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "${tag}" "${GITHUB_SHA}"
          git push origin "${tag}"
      - name: Create GitHub release
        if: steps.npm.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.pkg.outputs.version }}
        run: |
          tag="v${VERSION}"
          gh release create "${tag}" --title "${tag}" --generate-notes

      # The Official MCP Registry is a separate publication from npm. It is gated on the registry's
      # own state, not on the npm step, so a version already on npm but missing from the registry
      # is published on the next run instead of drifting further behind.
      - name: Check whether the MCP Registry already has this version
        id: registry
        env:
          SERVER: ${{ steps.pkg.outputs.server }}
          VERSION: ${{ steps.pkg.outputs.version }}
        run: |
          url="https://registry.modelcontextprotocol.io/v0.1/servers/${SERVER}/versions/${VERSION}"
          code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 30 --retry 3 --retry-connrefused "${url}")
          case "${code}" in
            200)
              echo "exists=true" >> "$GITHUB_OUTPUT"
              echo "MCP Registry already serves ${VERSION}. Skipping registry publish."
              ;;
            404)
              echo "exists=false" >> "$GITHUB_OUTPUT"
              echo "MCP Registry does not have ${VERSION} yet."
              ;;
            *)
              echo "::error::Unexpected status ${code} from the MCP Registry at ${url}."
              exit 1
              ;;
          esac

      - name: Install mcp-publisher
        if: steps.registry.outputs.exists == 'false'
        env:
          MCP_PUBLISHER_VERSION: '1.8.1'
        run: |
          base="https://github.com/modelcontextprotocol/registry/releases/download/v${MCP_PUBLISHER_VERSION}"
          archive="mcp-publisher_linux_amd64.tar.gz"
          work="${RUNNER_TEMP}/mcp-publisher"
          mkdir -p "${work}"
          cd "${work}"
          curl -fsSL --retry 3 -o "${archive}" "${base}/${archive}"
          curl -fsSL --retry 3 -o checksums.txt "${base}/registry_${MCP_PUBLISHER_VERSION}_checksums.txt"
          grep " ${archive}\$" checksums.txt | sha256sum --check --strict -
          tar -xzf "${archive}" mcp-publisher
          sudo install -m 0755 mcp-publisher /usr/local/bin/mcp-publisher
          mcp-publisher --version

      # The registry verifies ownership by reading `mcpName` out of the published npm package, so
      # it can only run once npm actually serves this version. npm answers the publish with "your
      # package is being processed and may take a few minutes to become available", and 0.15.1 took
      # about four of them. A 2.5-minute ceiling turned that ordinary lag into a failed release that
      # published to npm and skipped the registry, so keep the window well clear of it. Waiting
      # costs one idle runner; timing out costs a hand-run rerun and a registry left a version behind.
      - name: Wait for npm to serve this version
        if: steps.registry.outputs.exists == 'false'
        env:
          NAME: ${{ steps.pkg.outputs.name }}
          VERSION: ${{ steps.pkg.outputs.version }}
        run: |
          attempts=60
          delay=15
          for attempt in $(seq 1 "${attempts}"); do
            if npm view "${NAME}@${VERSION}" version >/dev/null 2>&1; then
              echo "npm serves ${NAME}@${VERSION} after $(( (attempt - 1) * delay ))s."
              exit 0
            fi
            echo "Attempt ${attempt}/${attempts}: npm does not serve ${NAME}@${VERSION} yet."
            sleep "${delay}"
          done
          echo "::error::npm never served ${NAME}@${VERSION} within $(( attempts * delay / 60 )) minutes; the registry publish would fail ownership validation. Re-run this job once npm serves it; the npm publish is skipped because the version already exists."
          exit 1

      - name: Publish to the Official MCP Registry
        if: steps.registry.outputs.exists == 'false'
        env:
          MCP_REGISTRY_DNS_PRIVATE_KEY: ${{ secrets.MCP_REGISTRY_DNS_PRIVATE_KEY }}
        run: |
          if [ -z "${MCP_REGISTRY_DNS_PRIVATE_KEY}" ]; then
            echo "::error::Repository secret MCP_REGISTRY_DNS_PRIVATE_KEY is not set. It is the hex-encoded ed25519 private key matching the 'v=MCPv1' TXT record on growsurf.com."
            exit 1
          fi
          mcp-publisher login dns \
            -algorithm ed25519 \
            -domain growsurf.com \
            -private-key "${MCP_REGISTRY_DNS_PRIVATE_KEY}"
          mcp-publisher publish

      - name: Clear the registry publisher session
        if: always()
        run: |
          command -v mcp-publisher >/dev/null 2>&1 && mcp-publisher logout || true
