name: Dependency audit

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '23 2 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Verify audit policy behavior
        run: node --test test/dependency-audit-checks.mjs
      - run: npm run audit:dependencies
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: dependency-audit
          path: audit-reports/
          retention-days: 14
          if-no-files-found: error
